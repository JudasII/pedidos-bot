[project]
name = "pedidos-bot"
version = "0.0.1"
description = "Asistente conversacional que toma pedidos de restaurantes por chat (Telegram en desarrollo, WhatsApp como destino)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.scripts]
pedidos-bot = "pedidos_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedidos_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pedidos_bot"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: requiere un servidor Ollama local con el modelo configurado (se omite por defecto)",
    "hosted: llama a un modelo hospedado (requiere API key; se omite por defecto)",
]
addopts = "-ra -m 'not ollama and not hosted'"
