[project]
name = "pedidos-bot"
version = "0.0.1"
description = "Conversational assistant that takes restaurant orders over chat (Telegram in development, WhatsApp as the target)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
]

[project.scripts]
pedidos-bot = "pedidos_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedidos_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pedidos_bot"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: requires a local Ollama server with the configured model (skipped by default)",
    "hosted: calls a hosted model (requires an API key; skipped by default)",
]
addopts = "-ra -m 'not ollama and not hosted'"

[tool.ruff.lint.per-file-ignores]
"scripts/github_bootstrap.py" = ["E501"]  # issue texts: readability over line width
