# Local development database. Credentials are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
